[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ofps-telegram"
version = "0.1.0"
description = "OpenFOAM process monitoring, persistent local queue and Telegram notifications"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cfd-bot = "cfd_bot.cli:main"
cfd-ticket-gui = "cfd_bot.gui:main"
cfd-ticket-web = "cfd_bot.web:main"

[tool.setuptools]
packages = ["cfd_bot"]

[tool.setuptools.package-data]
cfd_bot = ["web_static/*", "web_static/downloads/*.zip", "diagnostic_map.json"]

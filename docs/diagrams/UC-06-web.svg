<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="결과 파일 조회"><title>UC-06-web 결과 파일 조회</title><defs><marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#0284c7" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="800.0" y="40" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">UC-06-web · 결과 파일 조회</text><text x="800.0" y="71" text-anchor="middle" font-size="15" fill="#475569">web | #20 운영 반영 · 함수 요청은 실선 → / 반환은 점선 ← / 시간은 위에서 아래로</text><text x="800.0" y="97" text-anchor="middle" font-size="14" fill="#475569">진입: loadData / download → /api/artifacts → /api/file</text><path d="M150.0,155 V1090" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="40.0" y="112" width="220" height="42" fill="#16a34a"/><text x="150.0" y="139" text-anchor="middle" font-size="15" fill="white" font-weight="700">사용자 / web</text><rect x="40.0" y="1090" width="220" height="42" fill="#16a34a"/><text x="150.0" y="1117" text-anchor="middle" font-size="15" fill="white" font-weight="700">사용자 / web</text><path d="M563.3333333333333,155 V1090" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="453.33333333333326" y="112" width="220" height="42" fill="#16a34a"/><text x="563.3333333333333" y="139" text-anchor="middle" font-size="15" fill="white" font-weight="700">Browser JS</text><rect x="453.33333333333326" y="1090" width="220" height="42" fill="#16a34a"/><text x="563.3333333333333" y="1117" text-anchor="middle" font-size="15" fill="white" font-weight="700">Browser JS</text><path d="M976.6666666666666,155 V1090" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="866.6666666666666" y="112" width="220" height="42" fill="#16a34a"/><text x="976.6666666666666" y="139" text-anchor="middle" font-size="15" fill="white" font-weight="700">HTTP Handler</text><rect x="866.6666666666666" y="1090" width="220" height="42" fill="#16a34a"/><text x="976.6666666666666" y="1117" text-anchor="middle" font-size="15" fill="white" font-weight="700">HTTP Handler</text><path d="M1390.0,155 V1090" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="1280.0" y="112" width="220" height="42" fill="#16a34a"/><text x="1390.0" y="139" text-anchor="middle" font-size="15" fill="white" font-weight="700">WebApp</text><rect x="1280.0" y="1090" width="220" height="42" fill="#16a34a"/><text x="1390.0" y="1117" text-anchor="middle" font-size="15" fill="white" font-weight="700">WebApp</text><rect x="557.3333333333333" y="198" width="12" height="648" fill="#f0fdf4" stroke="#86efac"/><rect x="557.3333333333333" y="300" width="12" height="488" fill="#f0fdf4" stroke="#86efac"/><rect x="970.6666666666666" y="358" width="12" height="392" fill="#f0fdf4" stroke="#86efac"/><rect x="1384.0" y="442" width="12" height="270" fill="#f0fdf4" stroke="#86efac"/><rect x="1384.0" y="480" width="12" height="174" fill="#f0fdf4" stroke="#86efac"/><rect x="1384.0" y="538" width="12" height="58" fill="#f0fdf4" stroke="#86efac"/><path d="M156.0,198 H556.3333333333333" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="356.66666666666663" y="194" text-anchor="middle" font-size="15" fill="#111827">loadData / download(사용자 event / polling)</text><rect x="32" y="220" width="1536" height="38" rx="3" fill="#fffbeb" stroke="#fcd34d"/><text x="800.0" y="241" text-anchor="middle" font-size="14" fill="#854d0e">후속 /api/file은 Handler가 WebApp.file을 직접 호출: 재매칭→inside→open→fd 확인→64 KiB stream</text><path d="M569.3333333333333,300 H673.3333333333333 V318 H569.3333333333333" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="575.3333333333333" y="278" text-anchor="start" font-size="15" fill="#111827">api(/api/artifacts →</text><text x="575.3333333333333" y="296" text-anchor="start" font-size="15" fill="#111827">/api/file)</text><path d="M569.3333333333333,358 H969.6666666666666" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="770.0" y="354" text-anchor="middle" font-size="15" fill="#111827">web.Handler.handle_request(GET)</text><rect x="32" y="380" width="1536" height="38" rx="3" fill="#fffbeb" stroke="#fcd34d"/><text x="800.0" y="401" text-anchor="middle" font-size="14" fill="#854d0e">Host/Origin 검사; POST는 CSRF/JSON/2 MiB 검사</text><path d="M982.6666666666666,442 H1383.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="1183.3333333333333" y="438" text-anchor="middle" font-size="15" fill="#111827">web.WebApp.get(path, query)</text><path d="M1396.0,480 H1280.0 V498 H1396.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="1378.0" y="476" text-anchor="end" font-size="15" fill="#111827">web.WebApp.artifacts(cid)</text><path d="M1396.0,538 H1280.0 V556 H1396.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="1378.0" y="534" text-anchor="end" font-size="15" fill="#111827">web.WebApp.artifact_paths(cid,source)</text><path d="M1396.0,596 H1280.0 V614 H1396.0" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="1378.0" y="592" text-anchor="end" font-size="15" fill="#0284c7">(Case,Path[])</text><path d="M1396.0,654 H1280.0 V672 H1396.0" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="1378.0" y="650" text-anchor="end" font-size="15" fill="#0284c7">ArtifactGroup[]</text><path d="M1384.0,712 H983.6666666666666" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="1183.3333333333333" y="708" text-anchor="middle" font-size="15" fill="#0284c7">JSON 직렬화 값</text><path d="M970.6666666666666,750 H570.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="770.0" y="746" text-anchor="middle" font-size="15" fill="#0284c7">HTTP response</text><path d="M569.3333333333333,788 H673.3333333333333 V806 H569.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="575.3333333333333" y="784" text-anchor="start" font-size="15" fill="#0284c7">parsed JSON</text><path d="M557.3333333333333,846 H157.0" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="356.66666666666663" y="842" text-anchor="middle" font-size="15" fill="#0284c7">Promise / UI 상태</text><rect x="24" y="878" width="1552" height="77" fill="#fff1f2" stroke="#fda4af"/><text x="42" y="900" text-anchor="start" font-size="15" fill="#9f1239" font-weight="700">alt [오류 / 거절 분기]</text><text x="42" y="925" text-anchor="start" font-size="14" fill="#9f1239">403 권한/출처; 400 입력/파일; 404 경로; 500 기타 → api throw → toast/오류 화면</text><text x="800.0" y="995" text-anchor="middle" font-size="15" fill="#065f46" font-weight="700">최종 응답: 파일 목록 JSON; 후속 파일 HTTP는 binary inline/attachment</text></g></svg>

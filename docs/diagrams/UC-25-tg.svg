xt><text x="42" y="1631" text-anchor="start" font-size="14" fill="#9f1239">입력/파일 오류 → 오류 메시지; TelegramError 등은 serve 경고 후 offset 진행</text><text x="1170.0" y="1701" text-anchor="middle" font-size="15" fill="#065f46" font-weight="700">최종 응답: 메시지/패널 반영 → handle 반환 → offset journal → 다음 polling; SQLite는 background batch</text></g></svg>

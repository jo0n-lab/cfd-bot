<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1196" viewBox="0 0 1780 1196" role="img" aria-label="Residual 실제 HTTP 전송"><title>UC-05-file-web Residual 실제 HTTP 전송</title><defs><marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker><marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#0284c7" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="890.0" y="40" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">UC-05-file-web · Residual 실제 HTTP 전송</text><text x="890.0" y="71" text-anchor="middle" font-size="15" fill="#475569">web | #20 운영 반영 · 함수 요청은 실선 → / 반환은 점선 ← / 시간은 위에서 아래로</text><text x="890.0" y="97" text-anchor="middle" font-size="14" fill="#475569">진입: GET /api/file?case&amp;source&amp;file[&amp;download=1]</text><path d="M150.0,155 V1086" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="40.0" y="112" width="220" height="42" fill="#16a34a"/><text x="150.0" y="139" text-anchor="middle" font-size="15" fill="white" font-weight="700">사용자 / web</text><rect x="40.0" y="1086" width="220" height="42" fill="#16a34a"/><text x="150.0" y="1113" text-anchor="middle" font-size="15" fill="white" font-weight="700">사용자 / web</text><path d="M505.0,155 V1086" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="395.0" y="112" width="220" height="42" fill="#16a34a"/><text x="505.0" y="139" text-anchor="middle" font-size="15" fill="white" font-weight="700">HTTP Handler</text><rect x="395.0" y="1086" width="220" height="42" fill="#16a34a"/><text x="505.0" y="1113" text-anchor="middle" font-size="15" fill="white" font-weight="700">HTTP Handler</text><path d="M860.0,155 V1086" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="750.0" y="112" width="22
0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="682.5" y="666" text-anchor="middle" font-size="15" fill="#0284c7">(open stream, filename, size)</text><path d="M511.0,726 H615.0 V744 H511.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="517.0" y="704" text-anchor="start" font-size="15" fill="#111827">web.Handler.send_headers(mime,</text><text x="517.0" y="722" text-anchor="start" font-size="15" fill="#111827">disposition, size)</text><path d="M511.0,784 H615.0 V802 H511.0" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="517.0" y="780" text-anchor="start" font-size="15" fill="#0284c7">None</text><path d="M499.0,842 H157.0" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="327.5" y="838" text-anchor="middle" font-size="15" fill="#0284c7">binary HTTP response</text><rect x="24" y="874" width="1732" height="77" fill="#fff1f2" stroke="#fda4af"/><text x="42" y="896" text-anchor="start" font-size="15" fill="#9f1239" font-weight="700">alt [오류 / 거절 분기]</text><text x="42" y="921" text-anchor="start" font-size="14" fill="#9f1239">현재 선언 목록 제외/경로/크기 오류 400; 연결 종료는 stream 정리</text><text x="890.0" y="991" text-anchor="middle" font-size="15" fill="#065f46" font-weight="700">최종 응답: 브라우저 inline 이미지 또는 attachment 다운로드</text></g></svg>

33333333333 V272 H569.3333333333333" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="575.3333333333333" y="250" text-anchor="start" font-size="15" fill="#111827">catalog.TicketIndex.refresh(force=False)</text><path d="M569.3333333333333,312 H969.6666666666666" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="770.0" y="308" text-anchor="middle" font-size="15" fill="#111827">tickets.ticket_lock(정렬한 ticket folders)</text><path d="M970.6666666666666,350 H570.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="770.0" y="346" text-anchor="middle" font-size="15" fill="#0284c7">context manager; with 진입 시 획득</text><path d="M569.3333333333333,388 H673.3333333333333 V406 H569.3333333333333" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="575.3333333333333" y="384" text-anchor="start" font-size="15" fill="#111827">catalog.FolderWatch.drain()</text><rect x="32" y="430" width="1536" height="38" rx="3" fill="#fffbeb" stroke="#fcd34d"/><text x="800.0" y="451" text-anchor="middle" font-size="14" fill="#854d0e">Linux inotify; unsupported/dynamic glob은 metadata 비교</text><path d="M569.3333333333333,492 H673.3333333333333 V510 H569.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="575.3333333333333" y="488" text-anchor="start" font-size="15" fill="#0284c7">(changed paths, trust_lost)</text><text x="800.0" y="555" text-anchor="middle" font-size="14" fill="#6d28d9" font-weight="700">loop · 최초 / check / 이벤트 손실: 전체, 그 외 변경 파일만</text><path d="M569.3333333333333,596 H1383.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="976.6666666666666" y="592" text-anchor="middle" font-size="15" fill="#111827">config.load_case(대상 JSON)</text><path d="M1384.0,634 H570.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="976.6666666666666" y="630" text-anchor="middle" font-size="15" fill="#0284c7">검증된 Ticket</text><path d="M569.3333333333333,672 H1383.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="976.6666666666666" y="668" text-anchor="middle" font-size="15" fill="#111827">config.read_json(대상 JSON)</text><path d="M1384.0,710 H570.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="976.6666666666666" y="706" text-anchor="middle" font-size="15" fill="#0284c7">raw document / revision</text><path d="M569.3333333333333,786 H673.3333333333333 V804 H569.3333333333333" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="575.3333333333333" y="764" text-anchor="start" font-size="15" fill="#111827">catalog.active_cases(cached</text><text x="575.3333333333333" y="782" text-anchor="start" font-size="15" fill="#111827">tickets)</text><rect x="32" y="828" width="1536" height="38" rx="3" fill="#fffbeb" stroke="#fcd34d"/><text x="800.0" y="849" text-anchor="middle" font-size="14" fill="#854d0e">macro별 (ticket full path, root) set; child membership O(1). 변경 없는 refresh는 이 단계 생략</text><path d="M569.3333333333333,890 H673.3333333333333 V908 H569.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="575.3333333333333" y="886" text-anchor="start" font-size="15" fill="#0284c7">Case[]</text><path d="M569.3333333333333,948 H673.3333333333333 V966 H569.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="575.3333333333333" y="944" text-anchor="start" font-size="15" fill="#0284c7">검증된 index</text><path d="M569.3333333333333,1024 H673.3333333333333 V1042 H569.3333333333333" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#req)"/><text x="575.3333333333333" y="1002" text-anchor="start" font-size="15" fill="#111827">catalog.TicketIndex.cases(roots=None</text><text x="575.3333333333333" y="1020" text-anchor="start" font-size="15" fill="#111827">또는 현재 snapshot roots)</text><rect x="32" y="1066" width="1536" height="38" rx="3" fill="#fffbeb" stroke="#fcd34d"/><text x="800.0" y="1087" text-anchor="middle" font-size="14" fill="#854d0e">lookup(root)은 전체 경로 key로 단일 티켓 조회</text><path d="M569.3333333333333,1128 H673.3333333333333 V1146 H569.3333333333333" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="575.3333333333333" y="1124" text-anchor="start" font-size="15" fill="#0284c7">독립된 Case 사본</text><path d="M557.3333333333333,1186 H157.0" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/><text x="356.66666666666663" y="1182" text-anchor="middle" font-size="15" fill="#0284c7">TicketIndex</text><rect x="24" y="1218" width="1552" height="77" fill="#fff1f2" stroke="#fda4af"/><text x="42" y="1240" text-anchor="start" font-size="15" fill="#9f1239" font-weight="700">alt [오류 / 거절 분기]</text><text x="42" y="1265" text-anchor="start" font-size="14" fill="#9f1239">잘못된 등록 문서는 fail closed; 편집용 folder_index는 invalid entry를 별도 표시</text><text x="800.0" y="1335" text-anchor="middle" font-size="15" fill="#065f46" font-weight="700">최종 응답: cold rebuild / 변경분 재검증; warm 조회는 JSON load_case 0회</text></g></svg>

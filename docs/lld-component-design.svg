<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">ofps Telegram CFD bot Low-Level Design</title>
  <desc id="desc">인터페이스, application/domain, infrastructure 계층의 Python 모듈과 요청, 감시, 큐, 알림 흐름을 표시한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .lane-title { font-size: 20px; font-weight: 700; }
      .lane-sub { font-size: 12px; fill: #64748b; }
      .flow-title { font-size: 16px; font-weight: 700; }
      .card-title { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-sub { font-size: 11px; fill: #475569; text-anchor: middle; }
      .small { font-size: 11px; fill: #475569; }
      .badge { font-size: 12px; font-weight: 700; fill: white; text-anchor: middle; }
      .card { stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .interface { fill: #eff6ff; stroke: #60a5fa; }
      .app { fill: #f5f3ff; stroke: #a78bfa; }
      .domain { fill: #ecfdf5; stroke: #34d399; }
      .infra { fill: #fff7ed; stroke: #fb923c; }
      .store { fill: #f8fafc; stroke: #94a3b8; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.7; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#purple); }
      .rule { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#f8fafc"/>
  <text class="title" x="42" y="50">Low-Level Design</text>
  <text class="subtitle" x="42" y="78">Python 모듈 경계 · runtime flow · SQLite 상태 · JSON UI 리소스</text>

  <rect x="28" y="104" width="260" height="950" rx="16" fill="#eff6ff"/>
  <rect x="304" y="104" width="730" height="950" rx="16" fill="#f5f3ff"/>
  <rect x="1050" y="104" width="422" height="950" rx="16" fill="#fff7ed"/>
  <text class="lane-title" x="48" y="140">Interface</text>
  <text class="lane-sub" x="48" y="162">Telegram · GUI · CLI</text>
  <text class="lane-title" x="324" y="140">Application + Domain</text>
  <text class="lane-sub" x="324" y="162">dispatcher · monitor · scheduler · tickets · 판정</text>
  <text class="lane-title" x="1070" y="140">Infrastructure</text>
  <text class="lane-sub" x="1070" y="162">ofps · filesystem · SQLite · Telegram API</text>

  <text class="flow-title" x="48" y="202">1. 시작과 UI resource</text>
  <g transform="translate(52 220)">
    <rect class="card interface" width="200" height="70"/>
    <text class="card-title" x="100" y="28">cli.main / bot.serve</text>
    <text class="card-sub" x="100" y="49">config 경로 · command</text>
  </g>
  <g transform="translate(338 220)">
    <rect class="card app" width="210" height="70"/>
    <text class="card-title" x="105" y="28">config.load_bot</text>
    <text class="card-sub" x="105" y="49">bot + ticket schema 검증</text>
  </g>
  <g transform="translate(590 220)">
    <rect class="card domain" width="210" height="70"/>
    <text class="card-title" x="105" y="28">ui.UiCatalog</text>
    <text class="card-sub" x="105" y="49">namespace · format · manifest</text>
  </g>
  <g transform="translate(1088 220)">
    <rect class="card infra" width="330" height="70"/>
    <text class="card-title" x="165" y="27">bot.json + tickets + telegram-ui</text>
    <text class="card-sub" x="165" y="49">검증 실패 시 service 시작 중단</text>
  </g>
  <path class="arrow" d="M252 255H338"/>
  <path class="arrow" d="M548 255H590"/>
  <path class="arrow" d="M1088 255H800"/>

  <line class="rule" x1="48" y1="322" x2="1448" y2="322"/>
  <text class="flow-title" x="48" y="354">2. /stat — 현재 프로세스 직접 조회</text>
  <g transform="translate(52 374)">
    <rect class="card interface" width="200" height="72"/>
    <text class="card-title" x="100" y="28">Bot.handle / dispatch</text>
    <text class="card-sub" x="100" y="50">allowlist · /stat only</text>
  </g>
  <g transform="translate(338 374)">
    <rect class="card app" width="210" height="72"/>
    <text class="card-title" x="105" y="28">Bot.fresh_runs</text>
    <text class="card-sub" x="105" y="50">매 요청마다 새 snapshot</text>
  </g>
  <g transform="translate(590 374)">
    <rect class="card domain" width="210" height="72"/>
    <text class="card-title" x="105" y="28">report.compact_status</text>
    <text class="card-sub" x="105" y="50">티켓 이름 + 관측 owner/CPU</text>
  </g>
  <g transform="translate(1088 374)">
    <rect class="card infra" width="330" height="72"/>
    <text class="card-title" x="165" y="28">processes.snapshot → ofps</text>
    <text class="card-sub" x="165" y="50">SNAPSHOT_LOCK · parse_snapshot</text>
  </g>
  <path class="arrow" d="M252 410H338"/>
  <path class="arrow" d="M548 410H1088"/>
  <path class="arrow" d="M1088 428H800"/>
  <path class="arrow" d="M590 428H252"/>
  <text class="small" x="350" y="464">SQLite terminal 상태로 필터링하지 않음 · snapshot.cases만 표시</text>

  <line class="rule" x1="48" y1="488" x2="1448" y2="488"/>
  <text class="flow-title" x="48" y="520">3. Monitor — 등록·미등록 계산의 종료 판정</text>
  <g transform="translate(52 542)">
    <rect class="card interface" width="200" height="72"/>
    <text class="card-title" x="100" y="28">Telegram 알림</text>
    <text class="card-sub" x="100" y="50">시작 · 성공 · 실패 + Residual</text>
  </g>
  <g transform="translate(338 532)">
    <rect class="card app" width="210" height="92"/>
    <text class="card-title" x="105" y="27">monitor.Monitor</text>
    <text class="card-sub" x="105" y="49">observe · missing_polls</text>
    <text class="card-sub" x="105" y="68">automatic_case · managed 제외</text>
  </g>
  <g transform="translate(590 532)">
    <rect class="card domain" width="210" height="92"/>
    <text class="card-title" x="105" y="27">logs + outcomes</text>
    <text class="card-sub" x="105" y="49">incremental telemetry</text>
    <text class="card-sub" x="105" y="68">stopAt/endTime/final Time</text>
  </g>
  <g transform="translate(1088 532)">
    <rect class="card infra" width="330" height="92"/>
    <text class="card-title" x="165" y="27">ofps + case filesystem</text>
    <text class="card-sub" x="165" y="49">프로세스 소멸 · 최신 단계 로그</text>
    <text class="card-sub" x="165" y="68">controlDict · fatal · 표식 파일</text>
  </g>
  <path class="flow" d="M1088 568H800"/>
  <path class="flow" d="M590 568H548"/>
  <path class="flow" d="M338 588H252"/>
  <rect x="590" y="644" width="390" height="32" rx="16" fill="#16a34a"/>
  <text class="badge" x="785" y="665">succeeded = stopAt endTime + final Time ≥ endTime</text>
  <rect x="1000" y="644" width="418" height="32" rx="16" fill="#dc2626"/>
  <text class="badge" x="1209" y="665">failed = 조기 종료 · 판정 불가 · fatal · non-zero</text>

  <line class="rule" x1="48" y1="704" x2="1448" y2="704"/>
  <text class="flow-title" x="48" y="736">4. FIFO queue — admission과 독립 worker</text>
  <g transform="translate(52 758)">
    <rect class="card interface" width="200" height="72"/>
    <text class="card-title" x="100" y="28">/queue · TicketRun</text>
    <text class="card-sub" x="100" y="50">단일 / macro submit</text>
  </g>
  <g transform="translate(338 748)">
    <rect class="card app" width="210" height="92"/>
    <text class="card-title" x="105" y="27">jobs.Scheduler</text>
    <text class="card-sub" x="105" y="49">FIFO · environment · CPU 예약</text>
    <text class="card-sub" x="105" y="68">ofps --check · worker 복구</text>
  </g>
  <g transform="translate(590 748)">
    <rect class="card domain" width="210" height="92"/>
    <text class="card-title" x="105" y="27">jobs.worker</text>
    <text class="card-sub" x="105" y="49">pre → solver → post</text>
    <text class="card-sub" x="105" y="68">terminal_event · artifact freeze</text>
  </g>
  <g transform="translate(1088 748)">
    <rect class="card infra" width="330" height="92"/>
    <text class="card-title" x="165" y="27">OpenFOAM / Allrun</text>
    <text class="card-sub" x="165" y="49">taskset CPU_SET · foreground wait</text>
    <text class="card-sub" x="165" y="68">worker와 SQLite로 상태 공유</text>
  </g>
  <path class="arrow" d="M252 794H338"/>
  <path class="arrow" d="M548 794H590"/>
  <path class="arrow" d="M800 794H1088"/>

  <line class="rule" x1="48" y1="872" x2="1448" y2="872"/>
  <text class="flow-title" x="48" y="904">5. 상태·알림·편집 저장소</text>
  <g transform="translate(52 928)">
    <rect class="card interface" width="200" height="76"/>
    <text class="card-title" x="100" y="28">TicketChat / GUI</text>
    <text class="card-sub" x="100" y="50">공용 TicketService</text>
  </g>
  <g transform="translate(338 918)">
    <rect class="card domain" width="210" height="96"/>
    <text class="card-title" x="105" y="27">storage.Store</text>
    <text class="card-sub" x="105" y="49">transaction · CAS update</text>
    <text class="card-sub" x="105" y="68">event dedup · retry offset</text>
  </g>
  <g transform="translate(590 918)">
    <rect class="card app" width="210" height="96"/>
    <text class="card-title" x="105" y="27">bot.deliver</text>
    <text class="card-sub" x="105" y="49">outbox message/file cursor</text>
    <text class="card-sub" x="105" y="68">retry_after + backoff</text>
  </g>
  <g transform="translate(1088 908)">
    <rect class="card infra" width="330" height="116"/>
    <text class="card-title" x="165" y="25">state.sqlite3</text>
    <text class="card-sub" x="165" y="47">jobs · kv · outbox</text>
    <text class="card-sub" x="165" y="65">chat_messages · run_history</text>
    <text class="card-sub" x="165" y="88">WAL · unique active case</text>
  </g>
  <path class="arrow" d="M252 966H338"/>
  <path class="arrow" d="M548 966H590"/>
  <path class="arrow" d="M1088 966H800"/>

  <text class="small" x="48" y="1082">핵심 불변식: /stat = fresh ofps · 외부 계산 = ticket 없이 감시 · 성공 = endTime 도달 · 알림 = outbox 선저장 · UI = JSON resource</text>
</svg>

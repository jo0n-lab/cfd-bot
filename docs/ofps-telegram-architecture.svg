<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">ofps Telegram CFD bot 아키텍처와 주요 흐름</title>
  <desc id="desc">사용자, Telegram bot, ofps와 OpenFOAM의 실시간 조회, 종료 감시, 데이터 요청, 큐 실행 흐름과 controlDict 기반 종료 판정을 한 장에 표시한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .lane-title { font-size: 20px; font-weight: 700; }
      .lane-sub { font-size: 13px; fill: #64748b; }
      .flow-title { font-size: 16px; font-weight: 700; }
      .card-title { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-sub { font-size: 12px; fill: #475569; text-anchor: middle; }
      .small { font-size: 12px; fill: #475569; }
      .badge { font-size: 12px; font-weight: 700; fill: white; text-anchor: middle; }
      .card { stroke-width: 2; rx: 10; }
      .user { fill: #ffffff; stroke: #3b82f6; }
      .bot { fill: #fcfbff; stroke: #8b5cf6; }
      .foam { fill: #fffaf5; stroke: #f97316; }
      .state { fill: #f0fdf4; stroke: #10b981; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.7; marker-end: url(#arrow); }
      .watch { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#purple-arrow); }
      .rule { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#f8fafc"/>
  <text class="title" x="42" y="50">ofps → Telegram CFD bot</text>
  <text class="subtitle" x="42" y="78">실시간 현황과 자동 알림 모두 ofps 전체 CASE 직결 · controlDict와 로그로 종료 판정</text>

  <rect x="28" y="105" width="245" height="840" rx="16" fill="#eff6ff"/>
  <rect x="287" y="105" width="630" height="840" rx="16" fill="#f5f3ff"/>
  <rect x="931" y="105" width="441" height="840" rx="16" fill="#fff7ed"/>
  <text class="lane-title" x="48" y="140">사용자 단</text>
  <text class="lane-sub" x="48" y="162">Telegram · Web · GUI · CLI</text>
  <text class="lane-title" x="307" y="140">Telegram bot 단</text>
  <text class="lane-sub" x="307" y="162">router · monitor · queue · UI catalog · SQLite outbox</text>
  <text class="lane-title" x="951" y="140">ofps · OpenFOAM 단</text>
  <text class="lane-sub" x="951" y="162">프로세스 · CPU · controlDict · 로그 · 결과 파일</text>

  <text class="flow-title" x="48" y="200">1. /stat 실시간 현황</text>
  <g transform="translate(52 220)">
    <rect rx="10" class="card user" width="180" height="64"/>
    <text class="card-title" x="90" y="27">Telegram /stat</text>
    <text class="card-sub" x="90" y="47">현재 계산 요청</text>
  </g>
  <g transform="translate(330 220)">
    <rect rx="10" class="card bot" width="210" height="64"/>
    <text class="card-title" x="105" y="27">인증 + 명령 분기</text>
    <text class="card-sub" x="105" y="47">요청 시 즉시 snapshot</text>
  </g>
  <g transform="translate(982 220)">
    <rect rx="10" class="card foam" width="330" height="64"/>
    <text class="card-title" x="165" y="27">통합 bin/ofps 스캔</text>
    <text class="card-sub" x="165" y="47">활성 CASE · PID · CPU affinity</text>
  </g>
  <g transform="translate(610 220)">
    <rect rx="10" class="card state" width="250" height="64"/>
    <text class="card-title" x="125" y="27">경로 match + 한 줄 요약</text>
    <text class="card-sub" x="125" y="47">이름 | 소유 | 코어/CPU | 시간</text>
  </g>
  <path class="arrow" d="M232 252H330"/>
  <path class="arrow" d="M540 252H982"/>
  <path class="arrow" d="M982 270H860"/>
  <path class="arrow" d="M610 270H232"/>
  <text class="small" x="347" y="300">watcher 상태로 목록을 거르지 않음</text>

  <line class="rule" x1="48" y1="326" x2="1348" y2="326"/>
  <text class="flow-title" x="48" y="358">2. 백그라운드 감시와 종료 알림</text>
  <g transform="translate(330 380)">
    <rect rx="10" class="card bot" width="210" height="64"/>
    <text class="card-title" x="105" y="27">Monitor timer</text>
    <text class="card-sub" x="105" y="47">전체 CASE · 기본 5초</text>
  </g>
  <g transform="translate(982 380)">
    <rect rx="10" class="card foam" width="330" height="64"/>
    <text class="card-title" x="165" y="27">ofps snapshot</text>
    <text class="card-sub" x="165" y="47">등록·미등록 경로 · 소멸 감지</text>
  </g>
  <g transform="translate(982 470)">
    <rect rx="10" class="card foam" width="330" height="86"/>
    <text class="card-title" x="165" y="25">system/controlDict + 최신 로그</text>
    <text class="card-sub" x="165" y="46">stopAt · endTime · 최종 Time</text>
    <text class="card-sub" x="165" y="66">fatal · 종료 코드 · 실패 표식</text>
  </g>
  <g transform="translate(585 466)">
    <rect rx="10" class="card bot" width="305" height="94"/>
    <text class="card-title" x="152.5" y="24">종료 판정</text>
    <text class="card-sub" x="152.5" y="45">Time ≥ endTime → 정상 종료</text>
    <text class="card-sub" x="152.5" y="64">Time &lt; endTime → 조기 종료 실패</text>
    <text class="card-sub" x="152.5" y="82">명시적 오류는 항상 실패 우선</text>
  </g>
  <g transform="translate(330 478)">
    <rect rx="10" class="card state" width="210" height="70"/>
    <text class="card-title" x="105" y="28">SQLite outbox</text>
    <text class="card-sub" x="105" y="49">중복 방지 · 재시도</text>
  </g>
  <g transform="translate(52 482)">
    <rect rx="10" class="card user" width="180" height="64"/>
    <text class="card-title" x="90" y="27">Telegram 알림</text>
    <text class="card-sub" x="90" y="47">요약 + Residual</text>
  </g>
  <path class="watch" d="M540 412H982"/>
  <path class="watch" d="M1147 444V470"/>
  <path class="watch" d="M982 513H890"/>
  <path class="watch" d="M585 513H540"/>
  <path class="watch" d="M330 513H232"/>
  <rect x="548" y="574" width="372" height="36" rx="18" fill="#16a34a"/>
  <text class="badge" x="734" y="597">정상 = stopAt endTime + 최종 Time ≥ endTime</text>
  <rect x="944" y="574" width="382" height="36" rx="18" fill="#dc2626"/>
  <text class="badge" x="1135" y="597">실패 = 조기 종료 · 판정 불가 · fatal · non-zero exit</text>

  <line class="rule" x1="48" y1="634" x2="1348" y2="634"/>
  <text class="flow-title" x="48" y="666">3. /data 요청</text>
  <g transform="translate(52 688)">
    <rect rx="10" class="card user" width="180" height="60"/>
    <text class="card-title" x="90" y="25">/data</text>
    <text class="card-sub" x="90" y="44">케이스 · 파일 선택</text>
  </g>
  <g transform="translate(330 688)">
    <rect rx="10" class="card state" width="210" height="60"/>
    <text class="card-title" x="105" y="25">tickets/*.json</text>
    <text class="card-sub" x="105" y="44">pattern · 형식 · 개수</text>
  </g>
  <g transform="translate(982 688)">
    <rect rx="10" class="card foam" width="330" height="60"/>
    <text class="card-title" x="165" y="25">기존 후처리 결과</text>
    <text class="card-sub" x="165" y="44">Residual · contour · CSV · log</text>
  </g>
  <g transform="translate(610 688)">
    <rect rx="10" class="card bot" width="250" height="60"/>
    <text class="card-title" x="125" y="25">검증 후 Telegram 전송</text>
    <text class="card-sub" x="125" y="44">photo 또는 document</text>
  </g>
  <path class="arrow" d="M232 718H330"/>
  <path class="arrow" d="M540 718H982"/>
  <path class="arrow" d="M982 735H860"/>
  <path class="arrow" d="M610 735H232"/>

  <line class="rule" x1="48" y1="778" x2="1348" y2="778"/>
  <text class="flow-title" x="48" y="810">4. FIFO 큐 실행</text>
  <g transform="translate(52 832)">
    <rect rx="10" class="card user" width="180" height="60"/>
    <text class="card-title" x="90" y="25">/queue</text>
    <text class="card-sub" x="90" y="44">조회 · pause/resume · 취소</text>
  </g>
  <g transform="translate(330 832)">
    <rect rx="10" class="card state" width="210" height="60"/>
    <text class="card-title" x="105" y="25">SQLite FIFO</text>
    <text class="card-sub" x="105" y="44">대기 · 실행 상태</text>
  </g>
  <g transform="translate(610 832)">
    <rect rx="10" class="card bot" width="250" height="60"/>
    <text class="card-title" x="125" y="25">Scheduler + worker</text>
    <text class="card-sub" x="125" y="44">CPU 예약 · core 파일 · ofps 검사</text>
  </g>
  <g transform="translate(982 832)">
    <rect rx="10" class="card foam" width="330" height="60"/>
    <text class="card-title" x="165" y="25">OpenFOAM / Allrun</text>
    <text class="card-sub" x="165" y="44">case/.process-core 사용 · 종료 판정</text>
  </g>
  <path class="arrow" d="M232 862H330"/>
  <path class="arrow" d="M540 862H610"/>
  <path class="arrow" d="M860 862H982"/>

  <text class="small" x="48" y="932">설정 경계: tickets/*.json = 케이스 규칙 · telegram-ui/**/*.json = manifest로 검증되는 Telegram UI 리소스</text>
</svg>
